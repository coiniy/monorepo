admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
  # TCP listener for port 8340
  - name: tcp_8340_listener
    address:
      socket_address: { address: 0.0.0.0, port_value: 8340 }
    filter_chains:
    - filters:
      - name: envoy.filters.network.tcp_proxy
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
          stat_prefix: tcp_8340
          cluster: nodes_8340_cluster

  # UDP listener for port 8336 (QUIC)
  - name: udp_8336_listener
    address:
      socket_address: { address: 0.0.0.0, port_value: 8336, protocol: UDP }
    listener_filters:
    - name: envoy.filters.udp_listener.udp_proxy
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.filters.udp.udp_proxy.v3.UdpProxyConfig
        stat_prefix: udp_8336
        cluster: nodes_8336_cluster
        use_original_src_ip: false

  clusters:
  # TCP cluster for port 8340
  - name: nodes_8340_cluster
    connect_timeout: 5s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: nodes_8340_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: node1, port_value: 8340 }
        - endpoint:
            address:
              socket_address: { address: node2, port_value: 8340 }
        - endpoint:
            address:
              socket_address: { address: node3, port_value: 8340 }
        - endpoint:
            address:
              socket_address: { address: node4, port_value: 8340 }
        - endpoint:
            address:
              socket_address: { address: node5, port_value: 8340 }
        - endpoint:
            address:
              socket_address: { address: node6, port_value: 8340 }
        - endpoint:
            address:
              socket_address: { address: node7, port_value: 8340 }
        - endpoint:
            address:
              socket_address: { address: node8, port_value: 8340 }
        - endpoint:
            address:
              socket_address: { address: node9, port_value: 8340 }
        - endpoint:
            address:
              socket_address: { address: node10, port_value: 8340 }

  # UDP cluster for port 8336 (QUIC)
  - name: nodes_8336_cluster
    connect_timeout: 5s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: nodes_8336_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: node1, port_value: 8336 }
        - endpoint:
            address:
              socket_address: { address: node2, port_value: 8336 }
        - endpoint:
            address:
              socket_address: { address: node3, port_value: 8336 }
        - endpoint:
            address:
              socket_address: { address: node4, port_value: 8336 }
        - endpoint:
            address:
              socket_address: { address: node5, port_value: 8336 }
        - endpoint:
            address:
              socket_address: { address: node6, port_value: 8336 }
        - endpoint:
            address:
              socket_address: { address: node7, port_value: 8336 }
        - endpoint:
            address:
              socket_address: { address: node8, port_value: 8336 }
        - endpoint:
            address:
              socket_address: { address: node9, port_value: 8336 }
        - endpoint:
            address:
              socket_address: { address: node10, port_value: 8336 }