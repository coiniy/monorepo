version: '3.8'

services:
  node1:
    build: .
    container_name: quilibrium-node-1
    volumes:
      - ./node1-config:/root/.config
    ports:
      - "5010:8340"
      - "5011:8336"
      - "5012:8337"
      - "5013:8338"
      - "5014:8080"
    restart: always
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    
